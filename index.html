<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F-1000 - Reserva de Números</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .wrap {
      max-width: 1100px;
      margin: auto;
      padding: 16px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .premio-box {
      max-width: 650px;
      margin: 0 auto 18px;
      padding: 18px;
      text-align: center;
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
    }

    .premio-titulo {
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .premio-nome {
      margin: 7px 0;
      font-size: 24px;
      font-weight: bold;
    }

    .premio-valor {
      font-size: 20px;
      font-weight: bold;
    }

    .legenda {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .cor {
      display: inline-block;
      width: 13px;
      height: 13px;
      margin-right: 5px;
      border: 1px solid #aaa;
      border-radius: 3px;
    }

    .grade {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(58px, 1fr));
      gap: 7px;
    }

    .numero {
      padding: 11px 3px;
      border: 1px solid #bbb;
      border-radius: 8px;
      background: white;
      color: #000 !important;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
    }

    .numero.selecionado {
      background: #222;
      color: white !important;
      border-color: #222;
    }

    .numero.reservado {
      background: #ffd966;
      color: #222 !important;
      cursor: not-allowed;
    }

    .numero.confirmado {
      background: #7fcf82;
      color: #111 !important;
      cursor: not-allowed;
    }

    .painel {
      position: sticky;
      bottom: 0;
      margin-top: 18px;
      padding: 12px;
      background: white;
      border-top: 1px solid #ddd;
      box-shadow: 0 -4px 16px rgba(0,0,0,.12);
    }

    .resumo,
    .mensagem {
      margin: 8px 0;
      text-align: center;
      font-weight: bold;
      line-height: 1.4;
    }

    .formulario {
      display: grid;
      grid-template-columns: 2fr 1.4fr 1.4fr auto;
      gap: 8px;
      max-width: 950px;
      margin: auto;
    }

    input,
    button {
      padding: 12px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 15px;
    }

    #reservar {
      background: #111;
      color: white;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }

    #reservar:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    @media (max-width: 700px) {
      .wrap {
        padding: 10px;
      }

      .grade {
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
      }

      .formulario {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="wrap">
    <h1>Ford F-1000</h1>

    <div class="premio-box">
      <div class="premio-titulo">PRÊMIO PRINCIPAL</div>
      <div class="premio-nome">1 Caminhonete Ford F-1000</div>
      <div class="premio-valor">Valor de referência: R$ 55.000,00</div>
    </div>

    <div class="legenda">
      <span>
        <i class="cor" style="background:#fff;"></i>
        Disponível
      </span>

      <span>
        <i class="cor" style="background:#ffd966;"></i>
        Reservado
      </span>

      <span>
        <i class="cor" style="background:#7fcf82;"></i>
        Confirmado
      </span>
    </div>

    <div id="grid" class="grade">
      Carregando números...
    </div>
  </div>

  <div class="painel">
    <div id="selecionados" class="resumo">
      Nenhum número selecionado
    </div>

    <div class="formulario">
      <input id="nome" type="text" placeholder="Seu nome">
      <input id="telefone" type="tel" inputmode="tel" placeholder="WhatsApp">
      <input id="cpf" type="text" inputmode="numeric" placeholder="CPF">
      <button id="reservar" type="button" disabled>
        Reservar números
      </button>
    </div>

    <div id="msg" class="mensagem">
      Escolha um ou mais números disponíveis.
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const { createClient } = supabase;

    const db = createClient(
      "https://sjvzuoflqfyfbnyravmy.supabase.co",
      "sb_publishable_GgzTsAlQtOLRYiBKItXSCA_QBIEA8TW"
    );

    let escolhidos = new Set();

    const grid = document.getElementById("grid");
    const mensagem = document.getElementById("msg");
    const botaoReservar = document.getElementById("reservar");
    const resumoSelecionados = document.getElementById("selecionados");

    const campoNome = document.getElementById("nome");
    const campoTelefone = document.getElementById("telefone");
    const campoCpf = document.getElementById("cpf");

    function somenteDigitos(valor) {
      return String(valor || "").replace(/\D/g, "");
    }

    function atualizarResumo() {
      const lista = [...escolhidos].sort();

      if (lista.length === 0) {
        resumoSelecionados.textContent = "Nenhum número selecionado";
        botaoReservar.textContent = "Reservar números";
        botaoReservar.disabled = true;
        return;
      }

      resumoSelecionados.textContent =
        "Selecionados: " + lista.join(", ");

      botaoReservar.textContent =
        "Reservar " +
        lista.length +
        (lista.length === 1 ? " número" : " números");

      botaoReservar.disabled = false;
    }

    async function carregarNumeros() {
      const { data, error } = await db
        .from("numeros_publicos")
        .select("numero,status")
        .order("numero", { ascending: true });

      if (error) {
        console.error("Erro ao carregar números:", error);
        grid.textContent = "Não foi possível carregar os números.";
        return;
      }

      grid.innerHTML = "";

      data.forEach((item) => {
        const botao = document.createElement("button");

        botao.type = "button";
        botao.className = "numero";
        botao.textContent = item.numero;

        if (item.status === "reservado") {
          botao.classList.add("reservado");
          botao.disabled = true;
        } else if (
          item.status === "confirmado" ||
          item.status === "pago"
        ) {
          botao.classList.add("confirmado");
          botao.disabled = true;
        } else {
          if (escolhidos.has(item.numero)) {
            botao.classList.add("selecionado");
          }

          botao.addEventListener("click", () => {
            if (escolhidos.has(item.numero)) {
              escolhidos.delete(item.numero);
            } else {
              escolhidos.add(item.numero);
            }

            botao.classList.toggle("selecionado");
            atualizarResumo();
          });
        }

        grid.appendChild(botao);
      });
    }

    botaoReservar.addEventListener("click", async () => {
      const lista = [...escolhidos].sort();

      const nome = campoNome.value.trim();
      const telefone = somenteDigitos(campoTelefone.value);
      const cpf = somenteDigitos(campoCpf.value);

      if (!nome || !telefone || !cpf) {
        mensagem.textContent =
          "Preencha nome, WhatsApp e CPF.";
        return;
      }

      botaoReservar.disabled = true;
      mensagem.textContent = "Reservando...";

      const { data, error } = await db.rpc(
        "reservar_varios_numeros",
        {
          p_numeros: lista,
          p_nome: nome,
          p_telefone: telefone,
          p_cpf: cpf
        }
      );

      if (error) {
        console.error("Erro ao reservar:", error);

        mensagem.textContent =
          "Não foi possível concluir. Tente novamente.";

        botaoReservar.disabled = false;
        return;
      }

      if (data === true) {
        mensagem.innerHTML =
          "<strong>Reserva realizada com sucesso!</strong><br>" +
          "Agradecemos sua reserva. " +
          "Um de nossos organizadores entrará em contato pelo WhatsApp " +
          "para confirmar seus dados e passar as próximas orientações.";

        escolhidos.clear();

        campoNome.value = "";
        campoTelefone.value = "";
        campoCpf.value = "";

        atualizarResumo();
        await carregarNumeros();
      } else {
        mensagem.textContent =
          "Um dos números acabou de ser reservado. " +
          "Confira a grade e escolha novamente.";

        escolhidos.clear();

        atualizarResumo();
        await carregarNumeros();
      }
    });

    atualizarResumo();
    carregarNumeros();
  </script>

</body>
</html>
